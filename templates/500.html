{% extends "base.html" %}

{% block content %}
<div class="error-page">
    <div class="container">
        <div class="error-content">
            <div class="error-code">500</div>
            <h1>Техническая ошибка</h1>
            <p>На сервере произошла ошибка. Мы уже работаем над её устранением</p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn-primary">
                    <i class="fas fa-home"></i> На главную
                </a>
                <a href="{{ url_for('contacts') }}" class="btn-secondary">
                    <i class="fas fa-envelope"></i> Сообщить об ошибке
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .error-page {
        padding: 80px 0;
        min-height: calc(100vh - 300px);
        display: flex;
        align-items: center;
    }
    .error-content {
        text-align: center;
        max-width: 500px;
        margin: 0 auto;
    }
    .error-code {
        font-size: 80px;
        font-weight: 900;
        color: var(--toast-error);
        opacity: 0.3;
        line-height: 1;
    }
    .error-content h1 {
        font-size: 32px;
        color: var(--text-primary);
        margin: 16px 0 12px;
    }
    .error-content p {
        font-size: 16px;
        color: var(--text-secondary);
        margin-bottom: 24px;
    }
    .error-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }
    .error-actions .btn-primary,
    .error-actions .btn-secondary {
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }
    .error-actions .btn-primary {
        background: var(--gradient-main);
        color: white;
    }
    .error-actions .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(249,115,22,0.3);
    }
    .error-actions .btn-secondary {
        background: var(--bg-hover);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
    }
    .error-actions .btn-secondary:hover {
        background: var(--border-color);
        transform: translateY(-2px);
    }

    @media (max-width: 480px) {
        .error-code {
            font-size: 60px;
        }
        .error-content h1 {
            font-size: 24px;
        }
        .error-actions {
            flex-direction: column;
        }
        .error-actions .btn-primary,
        .error-actions .btn-secondary {
            justify-content: center;
        }
    }
</style>
{% endblock %}
